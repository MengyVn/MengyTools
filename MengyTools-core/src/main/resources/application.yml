spring:
  application:
    name: mengy-tools-core
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # 开启懒加载，降低启动内存占用（need.md 5.1）
  main:
    lazy-initialization: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8120}
  servlet:
    context-path: /
  compression:
    enabled: true

# 文件上传限制
spring.servlet.multipart:
  max-file-size: 10MB
  max-request-size: 20MB

# 图片上传：保存到本机 nginx 图片目录，由 nginx(1096) location /images/ 对外提供
mengy.upload:
  dir: ${UPLOAD_DIR:/home/mengy/MyWeb/www/xtgc-sushe/images}

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.mengy.tools.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false

# 业务配置
mengy:
  jwt:
    # 敏感配置：生产环境通过环境变量注入，绝不硬编码（need.md 6）
    secret: ${JWT_SECRET:ZGVmYXVsdC1qd3Qtc2VjcmV0LWZvci1kZXYtb25seS1wbGVhc2UtY2hhbmdlLWluLXByb2Q=}
    access-token-ttl: 30m      # Access Token 短期
    refresh-token-ttl: 7d       # Refresh Token 长期
    header: Authorization
    prefix: "Bearer "
  # 放行路径（无需鉴权）
  security:
    # CORS 白名单（逗号分隔）。支持通配写法：
    #   http://*.example.com          -> 任意子域
    #   http://localhost:[*]          -> 任意端口（[*] 表示端口不限）
    # 默认值面向本地/局域网开发：loopback 任意端口 + 私网 10.x / 192.168.x 任意端口，
    # 因此用 localhost 或局域网 IP 访问门户(9560)/管理端(9567) 都能正常联调。
    # 生产环境请用环境变量显式覆盖为真实域名，例如：
    #   ALLOWED_ORIGINS=https://blog.example.com,https://www.example.com
    # 注意：
    #   1) 因 allowCredentials=true，绝不要在生产保留 * 通配；
    #   2) 来源不在白名单时 Spring 会直接返回 403 "Invalid CORS request"，
    #      表现为“登录报 403 / 所有接口 403”——遇到时把当前地址加进本白名单并重启后端。
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:[*],http://127.0.0.1:[*],http://[::1]:[*],http://10.*:[*],http://192.168.*:[*]}
    permit-paths:
      - /api/v1/health
      - /api/v1/auth/login
      - /api/v1/auth/refresh
      - /api/v1/auth/me
      - /api/v1/portal/auth/register
      # 公开站点配置：前端 SSR 判断默认落地端与渲染站名
      - /api/v1/portal/settings
      - /api/v1/portal/auth/captcha/**
      - /api/v1/blog/articles
      - /api/v1/blog/articles/**
      - /api/v1/nav
      - /api/v1/tools
      - /api/v1/track/**
      - /doc.html
      - /swagger-ui/**
      - /v3/api-docs/**
      - /webjars/**
